on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: Be-Asado-api    # set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '16.x'                # set this to the node version to use
  DATABASE_URL: "mongodb://beasado:20KsQsbDiL0C7QkJ7kJ2zjcBQiDgG5xahBnPo40M8SmHif1vkFpJMNwVbnJUnjAsMa2Ac5ksQud7ACDb3Ks6oA==@beasado.mongo.cosmos.azure.com:10255/?ssl=true&retrywrites=false&maxIdleTimeMS=120000&appName=@beasado@!

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: npm install, build, and test
      run: |
        npm install
        npm run build --if-present
        npm run test --if-present

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v3
      with:
        name: node-app
        path: .

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v3
      with:
        name: node-app

    - name: 'Deploy to Azure WebApp'
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: <publishData><publishProfile profileName="BeAsadoApi - Web Deploy" publishMethod="MSDeploy" publishUrl="beasadoapi.scm.azurewebsites.net:443" msdeploySite="BeAsadoApi" userName="$BeAsadoApi" userPWD="CwMZYAs6gSbpM9muDlzCKZR0SeQvtDarwGwltFaxf8dkupWK0t0mh5v36PQe" destinationAppUrl="https://beasadoapi.azurewebsites.net" SQLServerDBConnectionString="" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="http://windows.azure.com" webSystem="WebSites"><databases /></publishProfile><publishProfile profileName="BeAsadoApi - FTP" publishMethod="FTP" publishUrl="ftps://waws-prod-blu-403.ftp.azurewebsites.windows.net/site/wwwroot" ftpPassiveMode="True" userName="BeAsadoApi\$BeAsadoApi" userPWD="CwMZYAs6gSbpM9muDlzCKZR0SeQvtDarwGwltFaxf8dkupWK0t0mh5v36PQe" destinationAppUrl="https://beasadoapi.azurewebsites.net" SQLServerDBConnectionString="" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="http://windows.azure.com" webSystem="WebSites"><databases /></publishProfile><publishProfile profileName="BeAsadoApi - Zip Deploy" publishMethod="ZipDeploy" publishUrl="beasadoapi.scm.azurewebsites.net:443" userName="$BeAsadoApi" userPWD="CwMZYAs6gSbpM9muDlzCKZR0SeQvtDarwGwltFaxf8dkupWK0t0mh5v36PQe" destinationAppUrl="https://beasadoapi.azurewebsites.net" SQLServerDBConnectionString="" mySQLDBConnectionString="" hostingProviderForumLink="" controlPanelLink="http://windows.azure.com" webSystem="WebSites"><databases /></publishProfile></publishData>
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
